<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Старосвет</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Справочник на русском по Warhammer Fantasy Battle 6–7 и 8, The Old World и WFRP 4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>/* Layout: sticky two-row header (brand + systems / sections), split reading view list|entry, book-like prose for rules text */
:root{
  --paper:#ECEAE3; --sheet:#F9F8F4; --sheet-2:#F2F0E9; --ink:#1C1A17; --ink-2:#48433D; --ink-3:#756F66;
  --rule:#D3CEC3; --rule-2:#E4E0D7;
  --blood:#8E1F1F; --blood-2:#A62B27; --blood-bg:#F4E2DE; --on-blood:#FFF8F5;
  --brass:#7A5C16; --brass-bg:#EFE4C9;
  --ok:#2F6B3B; --ok-bg:#E1EDDF; --warn:#8A5B00; --bad:#9C2323; --bad-bg:#F6DEDB;
  --c-wfb67:#8A6418; --c-wfb8:#36537A; --c-tow:#8E1F1F; --c-wfrp:#3C6447; --c-gen:#5B5650;
  --shadow:0 1px 2px rgba(28,26,23,.06),0 10px 28px rgba(28,26,23,.10);
  --f-display:'Alegreya SC','Alegreya',Georgia,'Times New Roman',serif;
  --f-body:'Alegreya','PT Serif',Georgia,'Times New Roman',serif;
  --f-ui:'Alegreya Sans','PT Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --hdr:108px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111316; --sheet:#181B20; --sheet-2:#1E2228; --ink:#E8E3D8; --ink-2:#C2BBAE; --ink-3:#8F887D;
    --rule:#31363E; --rule-2:#262B32;
    --blood:#E46B5F; --blood-2:#F28D82; --blood-bg:#3A201E; --on-blood:#1B0F0E;
    --brass:#D8B462; --brass-bg:#2C2517;
    --ok:#7FC58D; --ok-bg:#1C2B20; --warn:#E3B356; --bad:#F27C73; --bad-bg:#3A1E1C;
    --c-wfb67:#D8B462; --c-wfb8:#95B0D2; --c-tow:#E46B5F; --c-wfrp:#88BA96; --c-gen:#B9B2A6;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.40);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111316; --sheet:#181B20; --sheet-2:#1E2228; --ink:#E8E3D8; --ink-2:#C2BBAE; --ink-3:#8F887D;
  --rule:#31363E; --rule-2:#262B32;
  --blood:#E46B5F; --blood-2:#F28D82; --blood-bg:#3A201E; --on-blood:#1B0F0E;
  --brass:#D8B462; --brass-bg:#2C2517;
  --ok:#7FC58D; --ok-bg:#1C2B20; --warn:#E3B356; --bad:#F27C73; --bad-bg:#3A1E1C;
  --c-wfb67:#D8B462; --c-wfb8:#95B0D2; --c-tow:#E46B5F; --c-wfrp:#88BA96; --c-gen:#B9B2A6;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.40);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--sheet)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blood);outline-offset:2px;border-radius:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1440px;margin:0 auto}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top-row{display:flex;align-items:center;gap:14px;padding-block:9px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;flex:none}
.brand svg{width:30px;height:30px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.systabs{display:flex;gap:2px;background:var(--sheet-2);border:1px solid var(--rule-2);border-radius:10px;padding:3px;flex:none}
.systabs a{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:7px;text-decoration:none;font-weight:500;white-space:nowrap;color:var(--ink-2);font-size:14.5px}
.systabs a i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.systabs a:hover{color:var(--ink);background:var(--sheet)}
.systabs .ts{display:none}
.systabs a.on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),inset 0 -2px 0 var(--c)}
.top-tools{margin-left:auto;display:flex;align-items:center;gap:6px}
.searchbtn{display:flex;align-items:center;gap:8px;min-width:230px;padding:7px 10px;border:1px solid var(--rule);border-radius:9px;background:var(--paper);color:var(--ink-3);cursor:pointer;text-align:left}
.searchbtn:hover{border-color:var(--ink-3);color:var(--ink-2)}
.searchbtn kbd{margin-left:auto;font-family:var(--f-ui);font-size:12px;border:1px solid var(--rule);border-radius:5px;padding:0 6px;color:var(--ink-3);background:var(--sheet)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 9px;border:1px solid transparent;border-radius:9px;background:transparent;cursor:pointer;color:var(--ink-2);text-decoration:none}
.iconbtn:hover{background:var(--sheet-2);color:var(--ink);border-color:var(--rule-2)}
.iconbtn .lbl{font-size:13.5px}
.secnav{border-top:1px solid var(--rule-2)}
.secnav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:0}
.secnav .wrap::-webkit-scrollbar{display:none}
.secnav a{position:relative;display:flex;align-items:center;gap:6px;padding:9px 12px 10px;text-decoration:none;color:var(--ink-2);white-space:nowrap;font-weight:500;font-size:14.5px}
.secnav a:hover{color:var(--ink)}
.secnav a.on{color:var(--ink)}
.secnav a.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--c,var(--blood))}
.secnav a sup{font-size:11px;color:var(--ink-3);font-weight:400}
.secnav .sysname{font-family:var(--f-display);font-weight:700;color:var(--c);padding-right:10px;margin-right:4px;border-right:1px solid var(--rule-2)}

/* ---------- main containers ---------- */
main{min-height:60vh}
.page{padding-block:22px 48px}
.split{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:0;align-items:start}
.listpane{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));height:calc(100dvh - var(--hdr) - env(safe-area-inset-top,0px));display:flex;flex-direction:column;border-right:1px solid var(--rule);background:var(--sheet)}
.detailpane{min-width:0;padding:24px clamp(16px,3.2vw,48px) 64px}

.lp-head{padding:14px 14px 10px;border-bottom:1px solid var(--rule-2);display:flex;flex-direction:column;gap:10px}
.lp-title{display:flex;align-items:baseline;gap:8px}
.lp-title h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.15}
.lp-title span{color:var(--ink-3);font-size:13px}
.filter{display:flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:0 9px}
.filter input{flex:1;min-width:0;border:0;background:transparent;padding:7px 0;outline:none}
.filter:focus-within{border-color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer;color:var(--ink-2);line-height:1.6}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.lp-row2{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-3)}
.lp-row2 select{border:1px solid var(--rule);border-radius:7px;background:var(--sheet);padding:3px 6px;font-size:13px}
.lp-list{overflow-y:auto;flex:1;padding:0 0 24px;overscroll-behavior:contain}
.grp a{text-decoration:none}
.grp a:hover{color:var(--blood)}
.grp{position:sticky;top:0;z-index:1;background:var(--sheet);padding:10px 14px 4px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700;border-bottom:1px solid var(--rule-2)}
.row{display:flex;align-items:center;gap:10px;padding:7px 14px;text-decoration:none;border-left:3px solid transparent}
.row:hover{background:var(--sheet-2)}
.row.on{background:var(--blood-bg);border-left-color:var(--blood)}
.row .num{flex:none;width:22px;text-align:center;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.row .rm{flex:1;min-width:0}
.row .rn{display:block;font-weight:500;line-height:1.3}
.row .re{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rx{flex:none;font-size:12.5px;color:var(--brass);font-variant-numeric:tabular-nums;font-weight:700;text-align:right;max-width:46%}
.row .rx.dim{color:var(--ink-3);font-weight:500}
.empty{padding:28px 18px;color:var(--ink-3);text-align:center}

/* ---------- entry ---------- */
.entry{max-width:820px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);margin-bottom:10px}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs .dot{opacity:.5}
.backlink{display:none;align-items:center;gap:6px;margin-bottom:12px;font-size:14px;text-decoration:none;color:var(--blood);font-weight:500}
.entry h1,.hero h1,.sys-h1{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
.entry h1{font-size:clamp(28px,3.6vw,40px)}
.entry .en{font-family:var(--f-body);font-style:italic;color:var(--ink-3);font-size:17px;margin-top:4px}
.ehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:16px}
.eactions{display:flex;gap:4px;flex:none;margin-top:4px}
.star.on{color:var(--brass)}
.star.on svg{fill:var(--brass)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:1px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);background:var(--sheet);text-decoration:none;line-height:1.7}
.badge.sys{border-color:transparent;background:var(--c);color:var(--paper);font-weight:700}
.badge.key{background:var(--brass-bg);border-color:transparent;color:var(--brass);font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:1px;background:var(--rule-2);border:1px solid var(--rule-2);border-radius:10px;overflow:hidden;margin:0 0 18px}
.facts div{flex:1 1 170px;background:var(--sheet);padding:8px 12px;min-width:0}
.facts dt{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.facts dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.vtabs{display:flex;gap:4px;margin:0 0 12px;flex-wrap:wrap}
.vtabs button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.vtabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vnote{font-size:13px;color:var(--ink-3);margin:-4px 0 10px}

/* ---------- prose ---------- */
.prose{font-family:var(--f-body);font-size:18px;line-height:1.62;max-width:68ch}
.prose>*:first-child{margin-top:0}
.prose p{margin:0 0 .8em}
.prose h2{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.2;margin:1.4em 0 .5em;text-wrap:balance}
.prose h3{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.25;margin:1.2em 0 .4em;text-wrap:balance}
.prose ul,.prose ol{margin:0 0 .9em;padding-left:1.3em}
.prose li{margin:.18em 0}
.prose li::marker{color:var(--ink-3)}
.prose strong{font-weight:700}
.prose a.xref{color:var(--blood);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--blood) 45%,transparent)}
.prose a.xref:hover{text-decoration-color:var(--blood)}
.prose code{font-family:var(--f-ui);font-size:.9em;background:var(--sheet-2);border:1px solid var(--rule-2);border-radius:5px;padding:0 5px}
.callout{font-family:var(--f-ui);font-size:15.5px;line-height:1.5;border:1px solid var(--rule);border-left:4px solid var(--brass);background:var(--sheet);border-radius:8px;padding:10px 14px;margin:0 0 1em}
.callout.warn{border-left-color:var(--blood)}
.callout b.ct{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.tbl{overflow-x:auto;margin:0 0 1.1em;border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
.tbl table{border-collapse:collapse;width:100%;font-family:var(--f-ui);font-size:14.5px;line-height:1.4}
.tbl th,.tbl td{padding:6px 10px;border-bottom:1px solid var(--rule-2);text-align:left;vertical-align:top}
.tbl thead th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--sheet-2);font-weight:700;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.c,.tbl th.c{text-align:center}
.tbl .num{font-variant-numeric:tabular-nums}

/* profile (statline) */
.prof{overflow-x:auto;margin:0 0 16px;border:1px solid var(--ink);border-radius:8px;background:var(--sheet)}
.prof table{border-collapse:collapse;width:100%;font-family:var(--f-ui);font-variant-numeric:tabular-nums}
.prof th{font-family:var(--f-display);font-weight:700;font-size:15px;padding:6px 6px 2px;text-align:center;border-bottom:1px solid var(--rule);color:var(--ink)}
.prof th small{display:block;font-family:var(--f-ui);font-weight:500;font-size:10.5px;color:var(--ink-3);letter-spacing:.05em}
.prof th:first-child,.prof td:first-child{text-align:left;padding-left:12px;min-width:150px}
.prof td{text-align:center;padding:6px;border-bottom:1px solid var(--rule-2);font-size:15.5px}
.prof tr:last-child td{border-bottom:0}
.prof td:first-child{font-weight:500;font-size:14.5px}
.prof td:first-child a{text-decoration:none;color:var(--blood)}
.prof td:first-child a:hover{text-decoration:underline}

.ov-h{font-family:var(--f-display);font-weight:700;font-size:22px;margin:20px 0 10px}
.unres{border-bottom:1px dotted var(--ink-3)}
.related{margin-top:28px;padding-top:14px;border-top:1px solid var(--rule)}
.related h3{margin:0 0 8px;font-family:var(--f-display);font-size:18px}
.rel-list{display:flex;flex-wrap:wrap;gap:6px}
.rel-list a{font-size:14px;text-decoration:none;border:1px solid var(--rule);border-radius:8px;padding:3px 10px;background:var(--sheet)}
.rel-list a:hover{border-color:var(--blood);color:var(--blood)}
.srcnote{margin-top:22px;font-size:13px;color:var(--ink-3)}

/* ---------- home / system ---------- */
.hero{padding-block:34px 18px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:end;border-bottom:2px solid var(--ink)}
.hero h1{font-size:clamp(42px,7vw,86px)}
.hero p{font-family:var(--f-body);font-size:19px;line-height:1.55;color:var(--ink-2);margin:12px 0 0;max-width:56ch}
.hero .stats{display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:flex-end}
.hero .stats div{text-align:right}
.hero .stats b{display:block;font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.hero .stats span{font-size:12.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.syscards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:22px}
.syscard{background:var(--sheet);border:1px solid var(--rule);border-top:4px solid var(--c);border-radius:12px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.syscard h2{margin:0;font-family:var(--f-display);font-size:24px;line-height:1.1}
.syscard h2 a{text-decoration:none}
.syscard h2 a:hover{color:var(--c)}
.syscard p{margin:0;color:var(--ink-2);font-size:14.5px}
.syscard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--rule-2)}
.syscard li a{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule-2);text-decoration:none;font-size:14.5px}
.syscard li a:hover{color:var(--c)}
.syscard li a span{color:var(--ink-3);font-variant-numeric:tabular-nums}
.band{margin-top:34px}
.band h2{font-family:var(--f-display);font-size:26px;margin:0 0 12px}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.toolcard{display:flex;gap:12px;align-items:flex-start;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px;text-decoration:none;min-width:0}
.toolcard:hover{border-color:var(--ink-3)}
.toolcard svg.i{width:26px;height:26px;color:var(--blood);margin-top:2px}
.toolcard b{display:block;font-size:16px}
.toolcard span{display:block;font-size:13.5px;color:var(--ink-3);line-height:1.4;margin-top:2px}
.sys-h1{font-size:clamp(34px,5vw,58px);color:var(--ink)}
.sys-head{padding-block:28px 16px;border-bottom:2px solid var(--ink);display:flex;flex-direction:column;gap:8px}
.sys-head .kicker{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);font-weight:700}
.sys-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;margin-top:22px}
.sectiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sectile{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;text-decoration:none;display:flex;flex-direction:column;gap:3px;min-width:0}
.sectile:hover{border-color:var(--c)}
.sectile b{font-size:16.5px;display:flex;justify-content:space-between;gap:8px}
.sectile b span{color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
.sectile small{color:var(--ink-3);font-size:13.5px;line-height:1.4}
.qref{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;min-width:0}
.qref>h2{font-family:var(--f-display);margin:0 0 10px;font-size:22px}
.qref .prose{font-size:16.5px}

/* ---------- tools ---------- */
.tool{max-width:980px}
.tool h1{font-family:var(--f-display);font-size:clamp(30px,4vw,44px);margin:0 0 6px}
.tool .lead{color:var(--ink-2);margin:0 0 18px;max-width:70ch}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;margin-bottom:16px;min-width:0}
.panel h3{margin:0 0 10px;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}

<script>'use strict';
/* Registry shared by data files and the app. */
const DB = { entries: [], byId: new Map() };
const SC = { rules:'r', srules:'sr', spells:'sp', lores:'lo', items:'mi', armies:'ar', units:'u', weapons:'w',
  careers:'ca', skills:'sk', talents:'ta', conditions:'co', gear:'ge', qualities:'q', traits:'tr', gods:'go',
  species:'spc', glossary:'gl', blessings:'bl', psych:'ps' };
const TRL = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
function slug(s){
  return String(s||'').toLowerCase().split('').map(c => (TRL[c] !== undefined ? TRL[c] : c)).join('')
    .replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,64);
}
/* ADD(owner, section, [entries], defaults)
   entry fields: n (русское имя), e (оригинал), t (текст), v ({'67':..,'8':..} версии), m (мета), g (теги), id (необяз.) */
function ADD(owner, sec, items, defs){
  for (const raw of items){
    const e = Object.assign({}, defs || {}, raw);
    if (defs && defs.m && raw.m) e.m = Object.assign({}, defs.m, raw.m);
    e.o = owner; e.sec = sec;
    if (!e.id) e.id = owner + '-' + (SC[sec] || sec) + '-' + slug(e.k || e.e || e.n);
    if (DB.byId.has(e.id)) { let i = 2; while (DB.byId.has(e.id + '-' + i)) i++; e.id = e.id + '-' + i; }
    DB.entries.push(e); DB.byId.set(e.id, e);
  }
}
/* Profile helper for statlines: 'M WS BS S T W I A Ld' as a string. */
function P(name, s, extra){ return Object.assign({ n:name, p:String(s).trim().split(/\s+/) }, extra || {}); }
</script>
<script>/* 00_gen.js */
/* Общие страницы: о справочнике, обзоры систем, шпаргалки, вступления к разделам, глоссарий */
ADD('gen', 'about', [{ id:'gen-about', n:'О справочнике', t:`
«Старосвет» — справочник на русском языке по настольным играм в мире Warhammer Fantasy: Warhammer Fantasy Battle 6–7 и 8 редакций, Warhammer: The Old World и ролевой игре Warhammer Fantasy Roleplay 4-й редакции. Он устроен по образцу удобных справочников по D&D: всё разбито на короткие статьи, связанные перекрёстными ссылками.

## Как пользоваться
- **Поиск** открывается кнопкой вверху, клавишей «/» или сочетанием Ctrl+K. Ищет по русским и английским названиям, тегам и тексту статей. Если набрать слово не в той раскладке («ыекфр» вместо «strah»), справочник сам попробует её исправить.
- **Системы** переключаются вкладками в шапке, под ними — разделы выбранной системы.
- **Каждая статья понятна сама по себе.** Под текстом собраны короткие пояснения всех упомянутых в ней терминов, а у таблиц характеристик есть расшифровка. Ссылки ведут на полные статьи; если навести на ссылку мышь, появится краткое описание.
- **Редакции WFB разделены:** в разделах 6–7 редакций описаны только правила 6–7 редакций, в разделах 8-й — только правила 8-й.
- **Избранное** — звёздочка в карточке статьи. Список хранится только в вашем браузере.
- **Инструменты** — кубы, калькуляторы атаки, Лидерства, дальности атаки и результата боя, ростер армии, проверки и генератор персонажа WFRP, трекер боя.

## Обозначения
- Расстояния указаны в дюймах (″), как в правилах: 1″ ≈ 2,5 см.
- «4+» означает, что на D6 нужно выбросить 4 или больше. «D3» — бросок D6, поделённый пополам с округлением вверх.
- В текстах характеристики пишутся полностью. Сокращения встречаются только в заголовках таблиц, и под каждой такой таблицей есть расшифровка.
- Профиль отряда в WFB и The Old World: **Дв** — Движение (M), **ББ** — Ближний бой (WS), **НС** — Навык стрельбы (BS), **С** — Сила (S), **В** — Выносливость (T), **Р** — Раны (W), **И** — Инициатива (I), **А** — Атаки (A), **Лд** — Лидерство (Ld).
- Характеристики в WFRP: **ББ** — Ближний бой (WS), **ДБ** — Дальний бой (BS), **С** — Сила (S), **В** — Выносливость (T), **И** — Инициатива (I), **Лв** — Ловкость (Ag), **Сн** — Сноровка (Dex), **Инт** — Интеллект (Int), **СВ** — Сила воли (WP), **Об** — Общительность (Fel).
- В каждой статье рядом с русским названием указан английский оригинал, а в [[#glossary|глоссарии]] собраны все термины.

## Важно
Это неофициальный любительский справочник. Он не связан с правообладателями игр и не заменяет книги правил. Тексты — пересказ механик своими словами, поэтому формулировки отличаются от официальных. Данные сверены с книгами правил, книгами армий и опубликованными исправлениями, но опечатки возможны: в спорной ситуации на столе решает книга вашей редакции и договорённость игроков.
` }]);

ADD('wfb67', 'qref', [{ id:'wfb67-qref', n:'Шпаргалка', t:`
### Ход игрока
1. Начало хода.
2. Движение: объявить атаки и реакции, сплотить бегущих, обязательные перемещения, атаки, прочие перемещения.
3. Магия.
4. Стрельба.
5. Рукопашная.

### Попадание в рукопашной
Сравните Ближний бой атакующего и цели.
| Ближний бой атакующего | Нужно на кубе |
|---|---|
| Выше, чем у цели | 3+ |
| Не выше, но не меньше половины | 4+ |
| Меньше половины, чем у цели | 5+ |

### Попадание стрельбой
| Навык стрельбы | 1 | 2 | 3 | 4 | 5 | 6 |
|---|---|---|---|---|---|---|
| Нужно на кубе | 6+ | 5+ | 4+ | 3+ | 2+ | 1+ |

### Ранение
Из Силы удара вычтите Выносливость цели.
| Разница | +2 | +1 | 0 | −1 | −2 | −3 | −4 |
|---|---|---|---|---|---|---|---|
| Нужно на кубе | 2+ | 3+ | 4+ | 5+ | 6+ | 6+ | — |

Спасбросок за доспех ухудшается на 1 за каждую единицу Силы удара выше 3.

### Результат боя
Нанесённые ранения; +1 за каждую полную шеренгу из 4 и более моделей после первой (до +3); +1 за знамя; +1 за знамя армии; +1 за численное превосходство; +1 за атаку во фланг, +2 в тыл; +1 за возвышенность. Проигравший бросает 2D6: если выпало больше, чем его Лидерство минус разница в результате боя, отряд бежит.
` }]);

ADD('tow', 'qref', [{ id:'tow-qref', n:'Шпаргалка', t:`
### Ход игрока
1. Стратегия: начало хода, командование, заклинания чар и проклятий, сплочение бегущих.
2. Движение: атаки и реакции, ходы атакующих, обязательные перемещения, прочие перемещения.
3. Стрельба (и магические снаряды с вихрями).
4. Рукопашная: бои, результат, тесты на бегство, преследование.

### Попадание в рукопашной
Сравните Ближний бой атакующего и цели.
| Ближний бой атакующего | Нужно на кубе |
|---|---|
| Больше чем вдвое выше, чем у цели | 2+ |
| Выше, чем у цели | 3+ |
| Не выше, но не меньше половины | 4+ |
| Меньше половины, чем у цели | 5+ |

### Ранение
Из Силы удара вычтите Выносливость цели.
| Разница | +2 | +1 | 0 | −1 | от −2 до −5 | −6 |
|---|---|---|---|---|---|---|
| Нужно на кубе | 2+ | 3+ | 4+ | 5+ | 6+ | — |

### Магия
Сотворение: 2D6 плюс половина уровня мага (с округлением вверх) должно достичь сложности заклинания. Две шестёрки — безупречное сотворение, две единицы — магический сбой. Рассеивание: 2D6 (маг добавляет половину своего уровня) должно превысить результат сотворения.

### Тест на бегство
Проигравший бросает 2D6. Если выпавшее число больше его Лидерства, отряд бежит. Иначе к броску прибавляют разницу в результате боя: если сумма больше Лидерства, отряд отступает в порядке, если нет — уступает позицию.
` }]);
ADD('wfrp', 'qref', [{ id:'wfrp-qref', n:'Шпаргалка', t:`

Одно перемещение и одно действие. Ходьба — Движение × 2 ярда, бег — Движение × 4.

Каждая модель описывается профилем из девяти характеристик со значениями от 0 до 10.

| Сокр. | Характеристика | Что означает |
|---|---|---|
| Дв | Движение (M) | Сколько дюймов модель проходит за обычный ход |
| ББ | Ближний бой (WS) | Мастерство в рукопашной; сравнивается с Ближним боем противника |
| НС | Навык стрельбы (BS) | Меткость: чем выше, тем меньше нужно выбросить на попадание |
| С | Сила (S) | Насколько сильны удары; сравнивается с Выносливостью цели |
| В | Выносливость (T) | Способность выдержать удар |
| Р | Раны (W) | Сколько ран модель может потерять; на нуле она погибает |
| И | Инициатива (I) | Скорость реакции и порядок ударов в рукопашной |
| А | Атаки (A) | Сколько раз модель бьёт в рукопашной |
| Лд | Лидерство (Ld) | Храбрость и дисциплина; проверяется броском 2D6 |

У всадников, колесниц и монстров с наездником профиль раздельный: у всадника и скакуна свои характеристики. Скакун добавляет свои атаки, но в бою используются Выносливость и Раны всадника (у кавалерии) или общие значения (у колесниц и чудовищ), как указано в книге армии.

## Проверки характеристик
Чтобы пройти **тест характеристики** (например, Инициативы или Силы), бросьте D6: результат не выше значения характеристики — успех, 6 — всегда провал. **Тест Лидерства** бросается на 2D6: сумма не выше Лидерства — успех. Подробнее — [[Тесты и Лидерство]].
` },

Игроки ходят по очереди. Ход игрока делится на фазы, которые всегда идут в одном порядке.

1. **Начало хода.** Срабатывают правила, указанные для этого момента. Например, отряды с [[Тупость|тупостью]] проходят свои тесты.
2. **Движение.** Сначала объявляются все атаки и реакции противника, затем бегущие отряды пробуют [[Бегство, сплочение и преследование|сплотиться]], потом выполняются обязательные перемещения (бегство, бешеные и случайно двигающиеся отряды), атакующие отряды идут в контакт, и наконец двигаются все остальные.
3. **Магия.** Игрок получает кубы силы, противник — кубы рассеивания, маги сотворяют заклинания. См. [[Фаза магии]].
4. **Стрельба.** Отряды с метательным оружием и боевые машины стреляют. См. [[Стрельба]].

Ход заканчивается, и очередь переходит к противнику. Обычная партия длится 6 ходов каждого игрока.`,

{ n:'Тесты и Лидерство', e:'Characteristic & Leadership tests', m:{ o:3, part:'Основы' }, t:`
## Тест характеристики
Бросьте D6. Если выпало не больше значения характеристики, тест пройден. Выпавшая 6 — всегда провал, даже если характеристика равна 6 или больше.

## Тест Лидерства
Бросьте 2D6. Если сумма не больше Лидерства, тест пройден. Модификаторы (например, разница в результате боя) изменяют Лидерство, а не бросок.

- Отряд проходит тесты по **наибольшему Лидерству** среди своих моделей, включая присоединившихся персонажей.
- Отряды рядом с генералом могут использовать его Лидерство — см. [[Вдохновляющее присутствие]].
- **Безумная храбрость.** Если на тесте на бегство выпали две единицы, тест пройден, какими бы ни были модификаторы.

## Бегство
Бегущий отряд двигается прочь от врага на **2D6″**, а если его Движение больше 6 — на **3D6″**. Он игнорирует штрафы местности, но обходит непроходимые препятствия, не стреляет, не колдует и не может атаковать. Покинув стол, отряд выбывает из игры. Каждый ход, пока отряд не сплотится, он снова бежит в подфазе обязательных перемещений.

## Сплочение
В фазе движения бегущий отряд проходит тест Лидерства. При успехе он останавливается и может развернуться в любую сторону, но в этот ход не двигается и не стреляет. Отряд, в котором осталось **меньше 25%** стартовых моделей, сплотиться не может.

## Преследование
Победитель рукопашной может преследовать бегущего врага на 2D6″ (3D6″, если Движение больше 6). Если бросок преследования **не меньше броска бегства**, бегущие уничтожены. Чтобы удержаться от преследования, нужен тест Лидерства, объявленный до бросков. Врезавшись в свежий вражеский отряд, преследователи считаются атакующими, и бой начнётся в следующей фазе рукопашной.

**Прорыв.** Если атакующий отряд уничтожил всех противников в первом раунде, он может продвинуться вперёд на 2D6″ или 3D6″.`,

Противник бросает любое число своих кубов рассеивания. Сумма не меньше результата сотворения — заклинание рассеяно. Рассеять может любой отряд, даже если в армии нет магов. Свитки рассеивания отменяют заклинание без броска.

{ n:'Паника', e:'Panic', m:{ cat:'psy', rel:['Психология','Бегство, сплочение и преследование'] }, t:`
Тест паники — тест Лидерства. Провал означает, что отряд немедленно **бежит** прочь от причины паники (от вражеского отряда, нанёсшего потери, или от ближайшего врага).

**Когда нужен тест:**
- отряд потерял **25% моделей** за одну фазу от стрельбы или магии;
- союзный отряд **в 6″** уничтожен или сломлен в рукопашной;
- сквозь отряд **пробежали** бегущие союзники.

Отряд проходит не больше одного теста паники за фазу. Бегущие отряды и отряды, уже сражающиеся в рукопашной, панике не подвержены. [[Невосприимчивость к психологии]] позволяет не проходить тест.` },
{ n:'Страх', e:'Fear', m:{ cat:'psy' }, v:{

- Чтобы **атаковать** отряд, вызывающий страх, нужно пройти тест Лидерства. При провале отряд не атакует и остаётся на месте.
- Если отряд **проиграл бой** врагу, вызывающему страх, и тот превосходит его по [[Мощь отряда|мощи отряда]], проигравший бежит **автоматически**, без теста на бегство.

Отряды с [[Невосприимчивость к психологии|невосприимчивостью к психологии]] и сами вызывающие страх этим правилам не подчиняются.`,
'8':`Страх вызывают нежить, чудовища и другие жуткие существа; сами они страха не испытывают.

{ n:'Ужас', e:'Terror', m:{ cat:'psy' }, v:{

'8':`Ужас вызывают драконы, великаны и другие кошмарные чудовища. Отряд, **атакованный** таким существом, сразу проходит тест [[Паника|паники]] и при провале обязан выбрать реакцию «Бежать».

{ n:'Стойкость', e:'Steadfast', only:'8', m:{ cat:'psy', rel:['Результат боя и тест на бегство','Орда'] }, t:`

{ n:'Таранные удары', e:'Impact Hits', m:{ cat:'fight' }, v:{
'67':`Колесница, атаковавшая врага, наносит при контакте **D6 попаданий** со своей Силой (колесницы с косами — больше). Таранные удары наносятся первыми, до остальных атак.`,
'8':`Модель, атаковавшая в этот ход, наносит указанное число попаданий (например, D6 или D3) со своей Силой при Инициативе 10, раньше всех ударов. Такое правило есть у колесниц и некоторых чудовищ.` } },
{ n:'Сокрушительный натиск', e:'Devastating Charge', only:'8', m:{ cat:'fight' }, t:`
В ход, когда модель атаковала, она получает **+1 атаку**.` },
{ n:'Случайные атаки', e:'Random Attacks', m:{ cat:'fight' }, t:`
Вместо постоянного значения Атак модель каждый раз бросает указанные кубы (например, D6 или 2D6) и бьёт столько раз.` },
{ n:'Множественные раны', e:'Multiple Wounds', m:{ cat:'fight' }, t:`
Каждое неспасённое ранение превращается в указанное число ран, например «Множественные раны (D3)». Лишние раны не переходят на другие модели отряда.` },
{ n:'Бронебойность', e:'Armour Piercing', m:{ cat:'fight' }, t:`
Атака ухудшает спасбросок за доспех ещё на 1 сверх обычного модификатора за Силу. Ручницы и пистоли обладают этим свойством.` },
{ n:'Бой дополнительной шеренгой', e:'Fight in Extra Rank', only:'8', m:{ cat:'fight' }, t:`
Модель может наносить поддерживающие атаки ещё из одной шеренги: обычно копейщики бьют третьей шеренгой, а эльфийские копейщики и [[Орда|орды]] с копьями — ещё дальше.` },
{ n:'Орда', e:'Horde', only:'8', m:{ cat:'fight' }, t:`
Пехотный отряд шириной **10 и более моделей** (чудовищная пехота — 6 и более) наносит поддерживающие атаки ещё одной шеренгой. Вместе с копьями орда бьёт четырьмя шеренгами.` },
{ n:'Топот', e:'Stomp', only:'8', m:{ cat:'fight' }, t:`
После всех остальных ударов чудовищная пехота, чудовищная кавалерия и подобные модели наносят **одно автоматическое попадание** своей Силой по пехоте, боевым зверям или роям в контакте. Чудовища вместо этого наносят **громовой топот** — D6 таких попаданий.` },
{ n:'Регенерация', e:'Regeneration', m:{ cat:'fight' }, v:{
'67':`После проваленного спасброска за доспех бросьте D6 за каждое ранение: на **4+** рана восстанавливается. Против [[Огненные атаки|огненных атак]] регенерация не работает. Регенерированные раны всё равно засчитываются в результат боя.`,
'8':`Особый спасбросок, обычно **4+**, если не указано иное («Регенерация (5+)»). Его используют вместо [[Спасбросок оберега|оберега]], выбирая лучший. Против [[Огненные атаки|огненных атак]] не работает: раненный огнём отряд теряет регенерацию до конца фазы.` } },
{ n:'Спасбросок оберега', e:'Ward save', m:{ cat:'fight' }, t:`
Особая защита — магия, благословение или везение. Бросается после спасброска за доспех и **не ухудшается** от Силы или [[Бронебойность|бронебойности]]. Если у модели несколько оберегов, используется лучший, они не складываются.` },
{ n:'Чешуйчатая шкура', e:'Scaly Skin', only:'8', m:{ cat:'fight' }, t:`
Природная броня, например «Чешуйчатая шкура (5+)». Работает как спасбросок за доспех и улучшается щитом и бронёй (каждая даёт +1).` },
{ n:'Бесплотность', e:'Ethereal', m:{ cat:'fight' }, t:`
Духов и призраков можно ранить **только магическими атаками** и заклинаниями. Они проходят сквозь местность, как по открытой, но не могут закончить ход внутри непроходимой.` },
{ n:'Нестабильность', e:'Unstable', m:{ cat:'fight' }, t:`
Нежить и демоны не проходят тест на бегство. Вместо этого, проиграв бой, отряд теряет **столько дополнительных ран, сколько очков проиграл**, без каких-либо спасбросков. Подробности и исключения — в книгах армий.` },
{ n:'Сопротивление магии', e:'Magic Resistance', only:'8', m:{ cat:'fight' }, t:`
«Сопротивление магии (X)» даёт спасбросок оберега против заклинаний: (1) — 6+, (2) — 5+, (3) — 4+. Не складывается с другими оберегами.` },
{ n:'Крупная цель', e:'Large Target', m:{ cat:'shoot' }, v:{
'67':`Огромные модели видны поверх других отрядов и не прячутся за ними. Стреляющие по крупной цели получают **+1 к попаданию**.`,
'8':`Огромные модели видны поверх других отрядов и сами видят поверх них, поэтому крупную цель не спрятать за обычным полком.` } },
{ n:'Дыхание', e:'Breath Weapon', m:{ cat:'shoot' }, t:`
Дракон или другое существо выдыхает пламя, яд или холод. Положите шаблон пламени узким концом у модели: каждая модель под ним получает попадание с указанной Силой.`, v:{
'67':`Дыхание используется в фазе стрельбы.`,
'8':`Дыхание используется в фазе стрельбы. Существо, сражающееся в рукопашной, может вместо обычных атак выдохнуть по отряду, с которым сражается.` } },
/* ---------- стрельба ---------- */
{ n:'Несколько выстрелов', e:'Multiple Shots', m:{ cat:'shoot' }, t:`
Оружие может выстрелить указанное число раз, например «Несколько выстрелов (2)», но каждый выстрел получает −1 к попаданию. Можно стрелять и один раз без штрафа.` },
{ n:'Быстрый выстрел', e:'Quick to Fire', only:'8', m:{ cat:'shoot' }, t:`
Оружие не получает −1 за движение стрелка и за стрельбу в ответ на атаку.` },
{ n:'Двигаться или стрелять', e:'Move or Fire', m:{ cat:'shoot' }, t:`
Из этого оружия нельзя стрелять, если модель двигалась в этот ход, включая повороты и перестроения. Арбалеты, ручницы, большинство боевых машин.` },
{ n:'Залповый огонь', e:'Volley Fire', only:'8', m:{ cat:'shoot' }, t:`
Неподвижный отряд с луками стреляет первой шеренгой и **половиной моделей** остальных шеренг (с округлением вверх), пуская стрелы навесом через головы товарищей.` },
/* ---------- отряды ---------- */
{ n:'Мощь отряда', e:'Unit Strength', only:'67', m:{ cat:'unit' }, t:`
Мощь отряда — его условная численность. Обычная пехота даёт 1 за модель, кавалерия — 2, огры и подобные — 3, колесницы и чудовища — обычно по стартовым ранам.

Мощь отряда решает, кто получает +1 за **численное превосходство** в результате боя, бежит ли проигравший автоматически от [[Страх|страха]], и лишает ли атака во фланг или тыл противника бонуса шеренг (для этого нужна мощь 5 и больше).` },
{ n:'Командная группа', e:'Command group', m:{ cat:'unit' }, v:{
'67':`- **Чемпион** — лучший боец отряда с дополнительной атакой (или иной прибавкой). Бросает и принимает вызовы.
- **Знаменосец** — +1 к результату боя. Если отряд бежит и его догоняют, знамя достаётся врагу.
- **Музыкант** — при ничьей в бою его сторона побеждает с разницей в 1 очко.`,
'8':`- **Чемпион** — дополнительная атака (или иная прибавка); бросает и принимает вызовы, в том числе вместо персонажа своего отряда.
- **Знаменосец** — +1 к результату боя.
- **Музыкант** — побеждает при ничьей с разницей в 1, даёт +1 к Лидерству при сплочении и позволяет быстрое перестроение.` } }
]);

S('light7',3,'Целительная энергия','Healing Energy','5+','aug','Любая союзная модель','Союзная модель в любом месте поля **восстанавливает 1 рану**. Не действует на нежить, демонов, боевые машины и колесницы.'),
S('light7',4,'Слепящее сияние','Dazzling Brightness','6+','hex','18″, отряд в рукопашной','Ближний бой вражеского отряда в рукопашной падает до **1** до конца этой фазы рукопашной.'),
S('light7',5,'Охранный свет','Guardian Light','8+','rip','12″','Союзные отряды в 12″ от мага получают [[Невосприимчивость к психологии]]; в фазе сплочения они сплачиваются автоматически, даже если их осталось меньше 25%. Остаётся в игре.'),
S('light7',6,'Очистительная вспышка','Cleansing Flare','10+','dd','12″','Каждый вражеский отряд в 12″ от мага получает **D6 попаданий Силой 5** (нежить и демоны — Силой 6).'),
S('heavens7',1,'Знамение Фара','Portent of Far','5+','aug','12″','Союзный отряд (можно в рукопашной) до конца хода **перебрасывает единицы** на попадание и на ранение. Переброшенные единицы остаются.'),
S('heavens7',2,'Второй знак Амула','Second Sign of Amul','5+','aug','Сам маг','Бросьте D3 — столько **перебросов** получает игрок до конца своего хода. Ими можно перебросить любой бросок на попадание, ранение, спасбросок за доспех или оберег.'),
S('heavens7',3,'Небесный щит','Celestial Shield','7+','rip','24″','Союзный отряд получает **оберег 4+** против обычной стрельбы и магических снарядов. Остаётся в игре.'),

{ n:'Профиль и типы войск', e:'Model profiles & troop types', m:{ o:1, part:'Основы' }, t:`
Профиль модели состоит из девяти характеристик:

| Сокр. | Характеристика | Что означает |
|---|---|---|
| Дв | Движение (M) | Сколько дюймов модель проходит за обычный ход |
| ББ | Ближний бой (WS) | Мастерство в рукопашной; сравнивается с Ближним боем противника |
| НС | Навык стрельбы (BS) | Меткость: чем выше, тем меньше нужно выбросить на попадание |
| С | Сила (S) | Насколько сильны удары; сравнивается с Выносливостью цели |
| В | Выносливость (T) | Способность выдержать удар |
| Р | Раны (W) | Сколько ран модель может потерять; на нуле она погибает |
| И | Инициатива (I) | Скорость реакции и порядок ударов в рукопашной |
| А | Атаки (A) | Сколько раз модель бьёт в рукопашной |
| Лд | Лидерство (Ld) | Храбрость и дисциплина; проверяется броском 2D6 |

**Тест характеристики** — бросок D6: результат не выше значения характеристики — успех, 6 — всегда провал. **Тест Лидерства** — бросок 2D6: сумма не выше Лидерства — успех.

## Типы войск
Тип войск определяет, сколько моделей нужно для полной шеренги, какой максимальный бонус шеренг получает отряд и какова **мощь отряда** (Unit Strength) каждой модели.

| Тип войск | Моделей в шеренге | Предел бонуса шеренг | Мощь модели |
|---|---|---|---|
| Обычная пехота | 5 | +2 | 1 |
| Тяжёлая пехота | 4 | +2 | 1 |
| Чудовищная пехота | 3 | +2 | 3 |
| Рои | — | — | 3 |
| Лёгкая кавалерия | 5 | +1 | 2 |
| Тяжёлая кавалерия | 4 | +1 | 2 |
| Чудовищная кавалерия | 3 | +1 | 3 |
| Боевые звери | 5 | +1 | 1 |
| Лёгкие колесницы | 3 | +1 | 3 |
| Тяжёлые колесницы | — | — | 5 |
| Чудовищные создания, исполины, боевые машины | — | — | по стартовым ранам |

Особые правила вроде [[Орда|орды]] поднимают предел бонуса шеренг, а строй, местность и заклинания могут его снизить. Мощь отряда решает исход [[Массовая пехота|массовой пехоты]], паники и отступления в порядке.

## Особенности типов
- **Обычная пехота** с ручным оружием и щитом получает [[Парирование|парирование]].
- **Тяжёлая пехота** не расстраивает строй при ударе во фланг или тыл, если у врага мощь меньше 10.
- **Чудовищная пехота** неуклюжа и топчет мелких врагов.
` },
{ n:'Последовательность хода', e:'Turn sequence', m:{ o:2, part:'Основы' }, t:`
Ход игрока состоит из четырёх фаз.

1. **Стратегия.** Начало хода (особые тесты), командование (правила персонажей), сотворение чар и проклятий, сплочение бегущих. См. [[Фаза стратегии]].

## Объявление атак
Атакующий отряд должен видеть цель. Отряды в походной колонне, бегущие и уже сражающиеся атаковать не могут.

**Реакции на атаку:**
- **Держать позицию** — принять удар на месте.
- **Стоять и стрелять** — залп по атакующим, даже за пределами дальности оружия, затем отряд держит позицию. Нельзя, если атакующие стоят к цели ближе, чем значение их Движения.
- **Бежать** — развернуться прочь и пробежать 2D6″.
- [[Выстрел и бегство]] и [[Контратака]] — особые реакции для отрядов с этими правилами.

## Бросок атаки
Бросьте **2D6 и отбросьте наименьший куб** — это бросок атаки. Дальность атаки = бросок + Движение. Если её хватает, отряд идёт в контакт и выравнивается по цели. Если нет, атака **провалена**: отряд проходит к цели расстояние, равное броску атаки.

Отряд со [[Стремительность|стремительностью]] прибавляет к броску атаки ещё D6, а его предельная дальность атаки увеличивается на 3″.

Если атакуемый бежит, а атакующие дотянулись до него, бегущий отряд уничтожен. Не дотянувшись, атакующие проходят всю дальность атаки.

## Прочие перемещения
- **Марш**: удвоенное Движение (в походной колонне — утроенное), разрешены только заходы колесом. Если враг ближе 8″, сначала нужен тест Лидерства. После марша нельзя стрелять, включая магические снаряды и вихри.
- **Заход колесом** вокруг переднего угла.
- **Поворот** на 90° или 180° — четверть Движения за каждые 90°.
- **Шаг назад или вбок** — половина Движения.
- **Выравнивание шеренг** — половина Движения: добавить или убрать до пяти моделей из первой шеренги.
- **Перестроение** вокруг центра — всё Движение.

Ни одна модель не может пройти больше удвоенного Движения.

## Паника
Тест паники — тест Лидерства. Провалив его, отряд, в котором осталось больше половины стартовых моделей, **отступает в порядке**; если половина или меньше — **бежит**. Направление — прочь от причины паники или от ближайшего небегущего врага.

## Маги и заклинания
У мага 1–4 **уровня магии**. Перед расстановкой он бросает по D6 за каждый уровень по своей школе; повторы перебрасываются. Одно случайное заклинание можно заменить **коронным**. В каждой школе шесть номерных заклинаний и коронное.

## Когда колдуют
| Категория | Когда | Цель |
|---|---|---|
| Чары | Подфаза сотворения, фаза стратегии | Свои отряды |
| Проклятия | Подфаза сотворения, фаза стратегии | Вражеские отряды |
| Перемещения | Подфаза прочих перемещений | Свои отряды |
| Магические снаряды | Фаза стрельбы | Враг в зоне видимости, без броска на попадание |
| Магические вихри | Фаза стрельбы | Шаблон на поле, остаётся в игре |
| Натиск | Когда маг сражается в рукопашной | Враг, с которым маг в бою |

Маг пробует за ход не больше заклинаний, чем у него уровней, и каждое — не больше раза за ход. Маг в рукопашной сотворяет только натиск и заклинания «на себя».

## Сотворение
Бросьте **2D6 и прибавьте половину уровня мага** (с округлением вверх): 1-й и 2-й уровни +1, 3-й и 4-й +2. Результат не меньше сложности — заклинание сотворено. [[Сопротивление магии]] цели вычитается из броска.

- **Дубль 6** — **безупречное сотворение**: заклинание срабатывает при любой сложности и не может быть рассеяно.
- **Дубль 1** — **сбой**: заклинание обычно не сотворено, бросьте по таблице сбоев.

| 2D6 | Сбой |
|---|---|
| 2–4 | **Пространственный каскад.** 5″ шаблон кладётся на мага; каждая модель под ним рискует получить попадание Силы 10 с бронебойностью −4 |
| 5–6 | **Гибельный взрыв.** 3″ шаблон кладётся на мага; модели под ним получают попадания Силы 6 с бронебойностью −2 |
| 7 | **Небрежное сотворение.** Мага сбивает с ног: он получает попадание Силы 4 с бронебойностью −1 |
| 8–9 | **Едва сдержанная сила.** Заклинание сотворено со своей сложностью (для рассеивания), но больше маг в этот ход не колдует |
| 10–12 | **Истощение.** Заклинание сотворено безупречно, но больше маг в этот ход не колдует |

## Рассеивание
Противник может попытаться рассеять любое заклинание, кроме безупречного.
- **Рассеивание чародеем.** Выберите своего мага: 18″ от вражеского мага для 1–2 уровня, 24″ для 3–4. Бегущий маг не может, маг в бою — только заклинания против себя или своего отряда. Бросьте 2D6 + половину его уровня.
- **Рассеивание судьбой.** Раз в ход, без мага и без ограничения дальности: просто 2D6.

Рассеивание успешно, если результат **больше** результата сотворения (равенство — неудача). **Дубль 6** при рассеивании развеивает заклинание всегда. **Дубль 1** при рассеивании чародеем — маг «превзойдён в искусстве» и сам бросает по таблице сбоев.

## Связанные заклинания
Предметы и существа со связанными заклинаниями колдуют как маги, прибавляя к 2D6 **уровень силы** заклинания. Сбоев и безупречных сотворений у них нет, а модель сотворяет не больше одного связанного заклинания за фазу.

## Осечки
**Камнемёт** (D6): 1 — машина уничтожена; 2–4 — поломка: расчёт теряет рану, машина не стреляет в этот и следующий раунд; 5–6 — «Тванг!»: в этот ход выстрела нет.

**Пороховые машины** (D6): 1 — машина уничтожена; 2–4 — поломка, как выше; 5–6 — «Пшшш…»: в этот ход выстрела нет.

## Особенности
- **Стреломёты** пробивают шеренги и могут стрелять залпом.
- **Камнемёты** бьют навесом, не видя цель.
- **Пушки** стреляют ядром или картечью.
- **Огнемёты** выбрасывают столб огня.
` },
{ n:'Состав армии', e:'Warhammer armies', m:{ o:15, part:'Армия' }, t:`
Армия набирается на оговорённое число очков по **списку состава** фракции. Основной список — **Великая армия** (Grand Army):

| Категория | Доля |
|---|---|
| Персонажи | до 50% |
| Основные | не меньше 25% |
| Особые | до 50% |
| Редкие | до 25% |
| Наёмники | до 20% |
| Союзники | до 25% |

- В армии должно быть не меньше **трёх отрядов**, не считая персонажей.
- Генерал выбирается из персонажей; знамя армии несёт один из героев.
- Тематические списки — **армии дурной славы** (Armies of Infamy) — меняют проценты и доступные отряды.
- **Полки и отделения**: крупный полк может сопровождать небольшой отряд поддержки — см. [[Полковой отряд]] и [[Отделение]].

Проверить список можно в инструменте [[#tool-roster|«Ростер армии»]].
` },
{ n:'Местность', e:'Battlefield terrain', m:{ o:16, part:'Армия' }, t:`
- **Открытая местность** и **холмы**. Холм даёт обзор и +1 к результату боя за возвышенность; за гребнем холма можно укрыться.
- **Труднопроходимая местность** замедляет движение и, если в ней 25% моделей отряда или больше, расстраивает строй.
- **Опасная местность** заставляет проходить тесты: модель, провалившая тест, рискует потерять рану. [[Движение сквозь укрытия]] позволяет перебросить единицы.
- **Непроходимая местность** — пройти нельзя.
- **Низкие и высокие препятствия**: изгороди и стены дают укрытие; стоящий у обороняемого низкого препятствия отряд труднее атаковать.
- **Леса** закрывают обзор и мешают строю.
- **Особые места**: монолиты, руины, башни дают бонусы тому, кто их контролирует.
` }

ADD('tow', 'srules', [
/* ---------- психология ---------- */
{ n:'Паника', e:'Panic', m:{ cat:'psy', rel:['Психология'] }, t:`
Тест Лидерства. При провале отряд, в котором больше половины стартовых моделей, **отступает в порядке**, а отряд с половиной моделей и меньше — **бежит**, прочь от причины паники или от ближайшего небегущего врага.

Причины: потеря больше 25% моделей за фазу (кроме рукопашной); гибель союзного отряда с мощью 5+ в 6″; поражение и отступление такого отряда в 6″; бегущие союзники, прошедшие сквозь отряд. Подробнее — [[Психология]].` },
{ n:'Страх', e:'Fear', m:{ cat:'psy' }, t:`
- Чтобы **атаковать** врага, вызывающего страх и превосходящего атакующего по мощи отряда, нужно пройти тест Лидерства. При провале отряд не атакует и не двигается — это засчитывается как проваленная атака.
- Отряд, сражающийся с таким врагом, при выборе боя проходит тест Лидерства; при провале его модели получают **−1 к попаданию** по этому врагу.
- Отряд проходит не больше одного теста страха за ход. Существа, вызывающие страх, сами его не испытывают.` },
{ n:'Ужас', e:'Terror', m:{ cat:'psy' }, t:`
Существо, вызывающее ужас, вызывает и [[Страх|страх]] и само ужасу не подвержено.

- Когда отряд, вызывающий ужас, объявляет атаку, цель проходит тест Лидерства. Провал — она обязана **бежать**; успех — выбирает реакцию как обычно. Отряд, который не может бежать, тест не проходит.
- Если вызывающий ужас отряд на стороне победителя, каждый проигравший отряд получает **−1 к Лидерству** на тест на бегство.` },
{ n:'Бешенство', e:'Frenzy', m:{ cat:'psy' }, t:`
- **+1 атака** в ход, когда модель атаковала, и в ход после того, как она наступала за врагом (не распространяется на скакуна, тягловых животных и наездника чудовища).
- Если большинство моделей отряда бешеные, он автоматически проходит тесты страха, паники и ужаса, **не может бежать** в ответ на атаку и никогда не проходит тест на удержание от преследования.
- Отряд обязан объявить атаку, если может.
- Модель, проигравшая раунд рукопашной, сразу теряет бешенство.` },
{ n:'Ненависть', e:'Hatred', m:{ cat:'psy' }, t:`
«Ненависть (X)»: в **первом раунде** рукопашной модель перебрасывает промахи против ненавистных врагов. В скобках указан враг; «все враги» — ненавистны все.` },
{ n:'Тупость', e:'Stupidity', m:{ cat:'psy' }, t:`
В начале своего хода отряд, если он не бежит и не в рукопашной, проходит тест Лидерства. При провале до следующего начала хода он не двигается (разве что бежит), не стреляет, не колдует, не рассеивает заклинания чародеем и в ответ на атаку может только держать позицию. Персонаж с тупостью передаёт её отряду и скакуну.` },
{ n:'Порывистость', e:'Impetuous', m:{ cat:'psy' }, t:`
Когда отряд может объявить атаку, он проходит тест Лидерства. При провале он **обязан** атаковать; при успехе действует по своему усмотрению.` },
{ n:'Упорство', e:'Stubborn', m:{ cat:'psy' }, t:`
В первый раз, когда отряд должен пройти тест на бегство, он может отказаться от теста и автоматически **отступить в порядке**, даже если мощь победителя больше чем вдвое превосходит его. Отряд не становится упорным от присоединившегося упорного персонажа, а упорный персонаж в обычном отряде правилом не пользуется.` },
{ n:'Несгибаемость', e:'Unbreakable', m:{ cat:'psy' }, t:`
Проиграв раунд рукопашной, отряд не проходит тест на бегство, а автоматически **уступает позицию**. Персонажи без этого правила не могут присоединиться к несгибаемому отряду, и наоборот.` },
{ n:'Невосприимчивость к психологии', e:'Immune to Psychology', m:{ cat:'psy' }, t:`
Если большинство моделей отряда невосприимчивы к психологии, он автоматически проходит тесты страха, паники и ужаса, но не может бежать в ответ на атаку. От прочих тестов Лидерства правило не избавляет.` },
{ n:'Нестабильность', e:'Unstable', m:{ cat:'psy' }, t:`
Проиграв раунд рукопашной, отряд не проходит тест на бегство, а теряет **1 рану за каждое очко**, на которое проиграл. Раны снимаются после подсчёта результата, до тестов на бегство; [[Регенерация]] от них не спасает. Если в отряде есть нестабильные персонажи, сначала каждая модель получает по ране, а остаток распределяется поровну между персонажами и отрядом.` },
{ n:'Ветераны', e:'Veteran', m:{ cat:'psy' }, t:`
Если большинство моделей отряда — ветераны, он может повторить любой проваленный тест Лидерства. Тест на бегство тестом Лидерства не считается.` },
{ n:'Боевая ватага', e:'Warband', m:{ cat:'psy' }, t:`
- Небегущий отряд прибавляет свой **бонус шеренг** к Лидерству (не выше 10). Эта прибавка не действует на тест удержания от преследования и на тест [[Порывистость|порывистости]].
- Если большинство моделей — из боевой ватаги, отряд может перебросить бросок атаки.
- Отряд использует лучшее из: своего изменённого Лидерства, изменённого Лидерства персонажа из ватаги или неизменённого Лидерства обычного персонажа.` },
{ n:'Вдохновляющее присутствие', e:'Inspiring Presence', m:{ cat:'psy' }, t:`
Союзные отряды в радиусе командования генерала (дюймов по его Лидерству) используют Лидерство генерала вместо своего. Не действует, пока генерал бежит.` },
{ n:'Стоять насмерть', e:'Hold Your Ground', m:{ cat:'psy' }, t:`
Правило знамени армии. Отряды в радиусе командования знаменосца перебрасывают проваленные тесты **паники и сплочения** (если знаменосец не бежит). Тест на бегство можно перебросить, но второй результат принимается, даже если он хуже.` },
{ n:'Боевой клич', e:'Rallying Cry', m:{ cat:'psy' }, t:`
В подфазе командования персонаж не в рукопашной может выбрать один бегущий союзный отряд в своём радиусе командования: тот сразу проходит тест сплочения. При провале отряд может попытаться ещё раз в обычной подфазе сплочения.` },
{ n:'Ополчение', e:'Levies', m:{ cat:'psy' }, t:`

{ n:'Одиночка', e:'Loner', m:{ cat:'psy' }, t:`
Персонаж-одиночка не может быть генералом и не присоединяется к отрядам без этого правила. К отряду-одиночке не присоединяются персонажи без правила.` },

{ n:'Засадники', e:'Ambushers', m:{ cat:'move' }, t:`
Отряд можно держать в резерве. Начиная со второго раунда в начале своего хода бросайте D6 за каждый такой отряд: на 1–3 он задерживается, на **4+** выходит подкреплением в подфазе обязательных перемещений с любого края стола, не ближе 8″ к врагу. В начале пятого раунда оставшиеся засадники прибывают автоматически.` },
{ n:'Разведчики', e:'Scouts', m:{ cat:'move' }, t:`

{ n:'Полёт', e:'Fly', m:{ cat:'move' }, t:`

{ n:'Стремительность', e:'Swiftstride', m:{ cat:'move' }, t:`

{ n:'Притворное бегство', e:'Feigned Flight', m:{ cat:'move' }, t:`

{ n:'Выстрел и бегство', e:'Fire & Flee', m:{ cat:'move' }, t:`
Если большинство моделей отряда имеют это правило и метательное оружие, а атакующие видны, отряд может выбрать реакцию «выстрел и бегство»: дать залп, как при «стоять и стрелять», а затем бежать, бросив 2D6 и отбросив наименьший куб. Если атакующие ближе своего Движения, можно только держать позицию или бежать.` },
{ n:'Контратака', e:'Counter Charge', m:{ cat:'move' }, t:`

{ n:'Резервное перемещение', e:'Reserve Move', m:{ cat:'move' }, t:`
Отряд, который в фазе движения не атаковал, не маршировал и не бежал, может в конце своей фазы стрельбы сделать обычное перемещение с манёврами, но без марша.` },
{ n:'Вымуштрованные', e:'Drilled', m:{ cat:'move' }, t:`

{ n:'Движение сквозь укрытия', e:'Move Through Cover', m:{ cat:'move' }, t:`

{ n:'Случайное движение', e:'Random Movement', m:{ cat:'move' }, t:`

{ n:'Бесплотность', e:'Ethereal', m:{ cat:'move' }, t:`

{ n:'Сомкнутый строй', e:'Close Order', m:{ cat:'unit' }, t:`

{ n:'Рассыпной строй', e:'Open Order', m:{ cat:'unit' }, t:`
Отряды из таких моделей могут стоять в рассыпном строю: свободнее и маневреннее сомкнутого. См. [[Строй]].` },
{ n:'Застрельщики', e:'Skirmishers', m:{ cat:'unit' }, t:`

{ n:'Первая атака', e:'First Charge', m:{ cat:'move' }, t:`

{ n:'Сокрушение брони', e:'Armour Bane', m:{ cat:'fight' }, t:`

{ n:'Бронированная шкура', e:'Armoured Hide', m:{ cat:'fight' }, t:`

{ n:'Дополнительные атаки', e:'Extra Attacks', m:{ cat:'fight' }, t:`

{ n:'Бой в дополнительной шеренге', e:'Fight in Extra Rank', m:{ cat:'fight' }, t:`

{ n:'Яростный натиск', e:'Furious Charge', m:{ cat:'fight' }, t:`

{ n:'Горючий', e:'Flammable', m:{ cat:'fight' }, t:`

{ n:'Магические атаки', e:'Magical Attacks', m:{ cat:'fight' }, t:`

{ n:'Смертельный удар', e:'Killing Blow', m:{ cat:'fight' }, t:`
Естественная 6 на ранение в рукопашной против **пехоты и кавалерии** — смертельный удар: спасброски за доспех и регенерация не допускаются (оберег — допускается), а неспасённое ранение снимает все оставшиеся раны. Не работает при автоматических ранениях.` },
{ n:'Убийца чудовищ', e:'Monster Slayer', m:{ cat:'fight' }, t:`

{ n:'Множественные раны', e:'Multiple Wounds', m:{ cat:'fight' }, t:`
«Множественные раны (X)»: каждое неспасённое ранение превращается в X ран (при X-кубе бросайте за каждое ранение). Лишние раны на другие модели не переходят, но у персонажей идут в перебор.` },
{ n:'Ядовитые атаки', e:'Poisoned Attacks', m:{ cat:'fight' }, t:`
При естественной **6 на попадание** модель может прибавить **+2** к броску ранения этого попадания. Работает в стрельбе и в рукопашной, но не при автоматических попаданиях, не когда для попадания нужно 7+, не с заклинаниями и магическим оружием.` },
{ n:'Случайные атаки', e:'Random Attacks', m:{ cat:'fight' }, t:`
У модели нет постоянного числа атак: каждый раз бросьте указанные кубы (например, D3+1). Если таких моделей в шеренге несколько, бросайте за каждую.` },
{ n:'Регенерация', e:'Regeneration', m:{ cat:'fight' }, t:`
«Регенерация (X+)»: сразу после потери раны, до снятия модели, бросьте D6. На X+ рана восстанавливается, но всё равно учитывается в результате боя. Модификаторы брони значение X не меняют.` },
{ n:'Таранные удары', e:'Impact Hits', m:{ cat:'fight' }, t:`
«Таранные удары (X)»: атаковавшая модель, прошедшая 3″ или больше и стоящая в контакте с врагом, наносит X автоматических попаданий своей неизменённой Силой по атакованному отряду — в самом начале боя, до вызовов.` },
{ n:'Топот', e:'Stomp Attacks', m:{ cat:'fight' }, t:`
«Топот (X)»: модель в контакте с врагом наносит X автоматических попаданий неизменённой Силой **после всех остальных ударов**, даже после ударов с Инициативой 1.` },
{ n:'Удар первым', e:'Strike First', m:{ cat:'fight' }, t:`
В рукопашной Инициатива модели считается **10** до применения прочих модификаторов. С [[Удар последним|ударом последним]] взаимно отменяется.` },
{ n:'Удар последним', e:'Strike Last', m:{ cat:'fight' }, t:`
В рукопашной Инициатива модели считается **1** до применения прочих модификаторов. С [[Удар первым|ударом первым]] взаимно отменяется.` },
{ n:'Двуручное', e:'Requires Two Hands', m:{ cat:'fight' }, t:`
С этим оружием нельзя пользоваться щитом в рукопашной. От стрельбы и магии щит по-прежнему защищает.` },
{ n:'Сопротивление магии', e:'Magic Resistance', m:{ cat:'fight' }, t:`
«Сопротивление магии (−X)»: вражеские заклинания, включая связанные, нацеленные на отряд с такой моделью, получают −X к броску сотворения. Не суммируется — берётся наибольшее значение в отряде.` },
{ n:'Порождение варпа', e:'Warp-spawned', m:{ cat:'fight' }, t:`
Модель не может использовать регенерацию против ран от магических атак. Персонажи без этого правила не присоединяются к таким отрядам, и наоборот.` },
{ n:'«Па-а-адаю!»', e:'Timmm-berrr!', m:{ cat:'fight' }, t:`
Когда огромная модель теряет последнюю рану, победитель броска выбирает, куда она рухнет: во фронт, фланг или тыл. Каждый отряд в этом секторе, касающийся её подставки, получает D6 попаданий её Силой с бронебойность −1. Затем модель снимается.` },
{ n:'Стена щитов', e:'Shieldwall', m:{ cat:'fight' }, t:`
Раз за игру атакованный отряд в сомкнутом строю со щитами может вместо отступления в порядке **уступить позицию**, сомкнув щиты.` },
{ n:'Орда', e:'Horde', m:{ cat:'fight' }, t:`

{ n:'Массовая пехота', e:'Massed Infantry', m:{ cat:'troop' }, t:`
Если у стороны больше мощи отряда, чем у противника, и среди её отрядов есть хотя бы один с этим правилом, она получает **+1 к результату боя**.` },
{ n:'Парирование', e:'Parry', m:{ cat:'troop' }, t:`
Модель с ручным оружием и щитом, которая решила ими пользоваться, получает **+1 к спасброску** в рукопашной, но не лучше 3+.` },
{ n:'Поддерживающие атаки', e:'Supporting attacks', m:{ cat:'troop' }, t:`
Модели шеренги прямо за сражающейся могут бить через плечо товарищей, по одной атаке каждая, если позволяет их оружие. Поддерживать удар по флангу или тылу нельзя. [[Бой в дополнительной шеренге]] добавляет ещё одну шеренгу.` },
{ n:'Спасбросок оберега', e:'Ward save', m:{ cat:'fight' }, t:`

/* ---------- стрельба ---------- */
{ n:'Крупная цель', e:'Large Target', m:{ cat:'shoot' }, t:`

{ n:'Дыхание', e:'Breath Weapon', m:{ cat:'shoot' }, t:`

{ n:'Несколько выстрелов', e:'Multiple Shots', m:{ cat:'shoot' }, t:`
«Несколько выстрелов (X)»: оружие стреляет один раз или X раз с **−1 к попаданию** на каждый. Все модели отряда выбирают одно и то же.` },
{ n:'Стрельба на ходу', e:'Move & Shoot', m:{ cat:'shoot' }, t:`

{ n:'Двигаться или стрелять', e:'Move or Shoot', m:{ cat:'shoot' }, t:`
Из оружия нельзя стрелять, если модель в этот ход как-либо двигалась, включая сплочение и перестроение.` },
{ n:'Быстрый выстрел', e:'Quick Shot', m:{ cat:'shoot' }, t:`
Оружие не получает −1 за стрельбу после движения, а отряд может стрелять в ответ на атаку, как бы близко ни были атакующие.` },
{ n:'Неповоротливое', e:'Ponderous', m:{ cat:'shoot' }, t:`
Стреляя после движения, оружие получает −2 к попаданию вместо обычного −1.` },
{ n:'Громоздкое', e:'Cumbersome', m:{ cat:'shoot' }, t:`
Из оружия нельзя стрелять в ответ на атаку — его не успеть навести.` },
{ n:'Залповый огонь', e:'Volley Fire', m:{ cat:'shoot' }, t:`
Кроме первой шеренги (или двух на холме), стреляет **половина моделей** каждой задней шеренги, с округлением вверх, глядя глазами передних товарищей. Нельзя, если отряд в этот ход двигался или стреляет в ответ на атаку.` },
{ n:'Игнорирует укрытия', e:'Ignores Cover', m:{ cat:'shoot' }, t:`
Стрелок не получает штрафов к попаданию за частичное и полное укрытие цели.` },
/* ---------- отряды ---------- */
{ n:'Полковой отряд', e:'Regimental Unit', m:{ cat:'unit' }, t:`
Такой отряд может сопровождать [[Отделение|отделение]] — небольшой отряд поддержки, действующий рядом с полком.` },
{ n:'Отделение', e:'Detachment', m:{ cat:'unit' }, t:`
Отряд может быть взят как отделение при [[Полковой отряд|полковом отряде]]. Отделения поддерживают полк стрельбой и атаками и следуют особым правилам расстановки и Лидерства.` },
{ n:'Пёстрая компания', e:'Motley Crew', m:{ cat:'unit' }, t:`

]);

**Уровни успеха** — разница между десятками значения, против которого бросают, и десятками результата броска. Значение 47, бросок 21: 4 − 2 = **+2 уровня успеха**. Бросок 72 против 47: 4 − 7 = **−3 уровня успеха** (провал). Ноль при успехе записывается как «+0», при провале — как «−0».

- **01–05** — всегда успех, **96–00** — всегда провал.
- **Дубль** (11, 22… 00) в бою даёт критическое попадание при успехе и нелепую неудачу при провале.
- Чем больше уровней успеха, тем лучше результат: в бою они добавляются к урону.

## Встречная проверка
Когда персонажи противостоят друг другу (бой, торг, погоня, подкрадывание против внимательности), оба проходят проверки. Побеждает тот, у кого **больше уровней успеха**. При равенстве побеждает тот, у кого выше значение навыка. Разница в уровнях успеха показывает, насколько убедительна победа.

## Продолжительная проверка
Для долгих дел (ремонт корабля, поиск в архиве, вскрытие сложного замка) ведущий назначает, сколько уровней успеха нужно набрать. Персонаж проходит проверки раз за разом, складывая уровни успеха, пока не наберёт нужное число. Провалы могут отнимать уровни успеха или иметь последствия.

## Драматическая проверка
Если важна степень успеха, используйте таблицу:

| Уровни успеха | Итог |
|---|---|
| +6 и выше | Поразительный успех |
| +4…+5 | Впечатляющий успех |
| +2…+3 | Успех |
| +0…+1 | Скромный успех |
| −0…−1 | Досадный провал |
| −2…−3 | Провал |
| −4…−5 | Впечатляющий провал |
| −6 и ниже | Сокрушительный провал |

- **Мотивация** — короткая формулировка того, что движет персонажем. Действуя согласно мотивации, он восстанавливает решимость.

/* ================= indexes ================= */
const NAMEIDX = new Map();
const LORES = new Map(); // owner|key -> lore entry
const UNRES = new Set();
function buildIndexes(){
  const put = (k, id) => { if (k && !NAMEIDX.has(k)) NAMEIDX.set(k, id); };
  for (const e of DB.entries){
    const names = [e.n, e.e].concat(e.al || []);
    for (const nm of names){ const nn = norm(nm); if (!nn) continue; put(e.o + '|' + nn, e.id); put('*|' + nn, e.id); }
    if (e.sec === 'lores') LORES.set(e.o + '|' + e.k, e);
  }
}
function resolve(name, sysk){
  if (DB.byId.has(name)) return name;
  const nn = norm(name);
  for (const o of (OWNERS[sysk] || OWNERS.gen)){ const id = NAMEIDX.get(o + '|' + nn); if (id) return id; }
  return NAMEIDX.get('*|' + nn) || null;
}
const loreOf = e => LORES.get(e.o + '|' + (e.m && e.m.lore));
const loreName = e => { const l = loreOf(e); return l ? l.n : (e.m && e.m.lore) || ''; };

const armyOf = e => DB.entries.find(a => a.sec === 'armies' && a.o === e.o && a.k === (e.m && e.m.army));

/* ================= mini markup ================= */
function plain(src){
  return String(src || '').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, a, b) => b || a)
    .replace(/^\s*(?:[!?]>|#{1,6})\s*/gm, '').replace(/[*`]+/g, '').replace(/\|/g, ' ').replace(/-{3,}/g, ' ').replace(/\s+/g, ' ').trim();
}
function inl(s, sysk){
  s = esc(s);
  s = s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, a, b) => {
    const target = unesc(a).trim(); const label = b || a;
    if (target.startsWith('#')) return `<a class="xref" href="${esc(target)}">${label}</a>`;
    const id = resolve(target, sysk);
    if (!id){ UNRES.add(target + ' @' + sysk); return `<span class="unres">${label}</span>`; }
    return `<a class="xref" href="#${id}" data-id="${id}">${label}</a>`;
  });
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(«—–-])\*([^*\s][^*]*?)\*(?=$|[\s.,;:!?)»—–-])/g, '$1<em>$2</em>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  return s;
}
function mdTable(rows, sysk){
  const cells = rows.map(r => r.trim().replace(/\[\[([^\]]*)\]\]/g, m => m.replace(/\|/g, '\u0001')).replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim().replace(/\u0001/g, '|')));
  let head = null, body = cells;
  if (cells.length > 1 && cells[1].every(c => /^:?-{2,}:?$/.test(c))){ head = cells[0]; body = cells.slice(2); }
  const isNum = c => /^[−\-+]?[0-9DdКк×x/.,+−\-– ]+\+?$/.test(c) && c.length <= 14;
  let h = '<div class="tbl"><table>';
  if (head) h += '<thead><tr>' + head.map(c => `<th${isNum(c) ? ' class="c"' : ''}>${inl(c, sysk)}</th>`).join('') + '</tr></thead>';
  h += '<tbody>' + body.map(r => '<tr>' + r.map(c => `<td${isNum(c) ? ' class="c num"' : ''}>${inl(c, sysk)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
  return h;
}
function md(src, sysk){
  if (!src) return '';
  const lines = String(src).replace(/\r/g, '').split('\n');
  const out = []; let para = []; let i = 0;
  const flush = () => { if (para.length){ out.push('<p>' + inl(para.join(' '), sysk) + '</p>'); para = []; } };
  while (i < lines.length){
    const t = lines[i].trim();
    if (!t){ flush(); i++; continue; }
    if (/^#{2,3}\s/.test(t)){ flush(); const lv = t.startsWith('###') ? 3 : 2; out.push(`<h${lv}>${inl(t.replace(/^#+\s*/, ''), sysk)}</h${lv}>`); i++; continue; }
    if (/^[-•]\s/.test(t)){ flush(); const it = []; while (i < lines.length && /^\s*[-•]\s/.test(lines[i])){ it.push(lines[i].trim().replace(/^[-•]\s+/, '')); i++; } out.push('<ul>' + it.map(x => '<li>' + inl(x, sysk) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+[.)]\s/.test(t)){ flush(); const it = []; while (i < lines.length && /^\s*\d+[.)]\s/.test(lines[i])){ it.push(lines[i].trim().replace(/^\d+[.)]\s+/, '')); i++; } out.push('<ol>' + it.map(x => '<li>' + inl(x, sysk) + '</li>').join('') + '</ol>'); continue; }
    if (t.startsWith('|')){ flush(); const rows = []; while (i < lines.length && lines[i].trim().startsWith('|')){ rows.push(lines[i]); i++; } out.push(mdTable(rows, sysk)); continue; }
    if (t.startsWith('!>') || t.startsWith('?>')){
      flush(); const mk = t.slice(0, 2); const buf = [];
      while (i < lines.length && lines[i].trim().startsWith(mk)){ buf.push(lines[i].trim().slice(2).trim()); i++; }
      const warn = mk === '!>';
      out.push(`<div class="callout${warn ? ' warn' : ''}"><b class="ct">${warn ? 'Важно' : 'Пример'}</b>${inl(buf.join(' '), sysk)}</div>`);
      continue;
    }
    para.push(t); i++;
  }
  flush();
  return out.join('');
}

}

/* ================= Leadership ================= */
function pLd(target, cold, insane){
  let p = 0;
  if (cold){ for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) for (let c = 1; c <= 6; c++){ const s = [a, b, c].sort((x, y) => x - y); if (s[0] + s[1] <= target || (insane && s[0] === 1 && s[1] === 1)) p += 1 / 216; } }
  else for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++){ if (a + b <= target || (insane && a === 1 && b === 1)) p += 1 / 36; }
  return p;
}

/* ================= Charge range ================= */
function chargeDist(ed, swift){
  const d = new Map(); const add = (k, p) => d.set(k, (d.get(k) || 0) + p);
  if (ed === '8'){
    if (swift){ for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) for (let c = 1; c <= 6; c++){ const s = [a, b, c].sort((x, y) => x - y); add(s[1] + s[2], 1 / 216); } }
    else for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) add(a + b, 1 / 36);
  } else {
    for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++){ const r = Math.max(a, b); if (swift){ for (let c = 1; c <= 6; c++) add(r + c, 1 / 216); } else add(r, 1 / 36); }
  }
  return d;
}

      const one = () => { let b = 0, f = 0, g = 0; for (let x = 1; x <= 6; x++) for (let y = 1; y <= 6; y++){ const n = x + y, m = n + diff; if (x === 1 && y === 1) g++; else if (n > ld) b++; else if (m > ld) f++; else g++; } return [b / 36, f / 36, g / 36]; };
      if (unb){ pG = 1; } else if (stub){ pF = 1; } else { [pB, pF, pG] = one(); if (bsb){ const b0 = pB; pF = pF + b0 * pF; pG = pG + b0 * pG; pB = b0 * b0; } }
      if (chk(root, 'kdbl') && !stub){ pB += pF; pF = 0; }
      res = `<div style="flex-basis:100%">${bars([['Бежит', pB], ['Отступает в порядке', pF], ['Уступает позицию', pG]])}</div>
        <p style="flex-basis:100%;margin:6px 0 0;color:var(--ink-2)">Если выпавшее число больше Лидерства (${ld}), отряд бежит. Иначе к броску прибавляется разница в результате боя (${diff}): если сумма больше Лидерства, отряд отступает в порядке, если нет (или выпали две единицы) — уступает позицию.${bsb ? ' С переброской от знамени армии расчёт предполагает, что перебрасывается только результат «бежит»: второй бросок принимается, даже если он хуже.' : ''}</p>`;
    }
    out.innerHTML = `<div class="result"><div><div class="k">Счёт А : Б</div><div class="big">${A.t} : ${B.t}</div></div><div><div class="k">Победитель</div><div class="big">${win}</div></div><div><div class="k">Разница</div><div class="big">${diff}</div></div>${res}</div>`;
  };
  root.addEventListener('input', calc); root.addEventListener('change', calc); calc();
}

const ROSTER_CATS = { '67':[['lord','Лорды'],['hero','Герои'],['core','Основные'],['special','Особые'],['rare','Редкие']], '8':[['lord','Лорды'],['hero','Герои'],['core','Основные'],['special','Особые'],['rare','Редкие']], 'tow':[['char','Персонажи'],['core','Основные'],['special','Особые'],['rare','Редкие'],['merc','Наёмники'],['ally','Союзники']] };
function slots67(pts){ const k = Math.max(0, Math.floor((pts - 2000) / 1000) + 1); if (pts < 2000) return { lord:0, hero:3, core:2, special:3, rare:1 }; return { lord:k, hero:2 + 2 * k, core:2 + k, special:3 + k, rare:1 + k }; }

    R.rows.forEach(r => { sum[r.c] = (sum[r.c] || 0) + (+r.p || 0); cnt[r.c] = (cnt[r.c] || 0) + 1; });
    const tot = R.rows.reduce((a, r) => a + (+r.p || 0), 0); const L = R.limit;
    const rules = [];

      rules.push(['Лорды ≤ 25%', sum.lord <= L * .25, sum.lord], ['Герои ≤ 25%', sum.hero <= L * .25, sum.hero], ['Основные ≥ 25%', sum.core >= L * .25, sum.core], ['Особые ≤ 50%', sum.special <= L * .5, sum.special], ['Редкие ≤ 25%', sum.rare <= L * .25, sum.rare], ['Не менее 3 отрядов без персонажей', (cnt.core + cnt.special + cnt.rare) >= 3, String(cnt.core + cnt.special + cnt.rare)]);
    } else if (R.ed === '67'){
      const s = slots67(L);
      rules.push(['Лордов не больше ' + s.lord, cnt.lord <= s.lord, String(cnt.lord)], ['Персонажей не больше ' + s.hero, (cnt.lord + cnt.hero) <= s.hero, String(cnt.lord + cnt.hero)], ['Основных отрядов не меньше ' + s.core, cnt.core >= s.core, String(cnt.core)], ['Особых отрядов не больше ' + s.special, cnt.special <= s.special, String(cnt.special)], ['Редких отрядов не больше ' + s.rare, cnt.rare <= s.rare, String(cnt.rare)]);
    } else {

      <p style="color:var(--ink-3);font-size:13px;margin:10px 0 0">${R.ed === '67' ? 'Лимиты считаются по числу отрядов: до 2000 очков — 0 лордов, 3 персонажа, 2+ основных, до 3 особых и 1 редкого; каждые следующие 1000 очков добавляют лорда, 2 персонажа, основной, особый и редкий слот. Лорд занимает и место персонажа.' : R.ed === '8' ? 'Лимиты считаются в процентах от общей стоимости армии. Повторы одного и того же особого или редкого отряда ограничены отдельно.' : 'Проценты списка «Великая армия» (Grand Army). Списки фракций и «Армии дурной славы» могут менять лимиты.'}</p>`;
  };
  root.addEventListener('input', ev => {
    const t = ev.target;
    if (t.id === 'rname'){ R.name = t.value; save(); return; }
    if (t.id === 'rlim'){ R.limit = Math.max(0, Math.round(+t.value || 0)); save(); check(); return; }
    const tr = t.closest('tr[data-i]'); if (tr && t.dataset.k){ const r = R.rows[+tr.dataset.i]; r[t.dataset.k] = t.dataset.k === 'p' ? (+t.value || 0) : t.value; save(); check(); }

  root.addEventListener('click', ev => {

      const txt = `${R.name} — ${ED.find(x => x[0] === R.ed)[1]}, ${tot}/${R.limit} очков\n` + cats.map(([k, t]) => { const rs = R.rows.filter(r => r.c === k); return rs.length ? `\n${t}:\n` + rs.map(r => `  ${r.n} — ${r.p}`).join('\n') : ''; }).join('');
      copyText(txt);
    }
  });
  draw();
}

/* ================= WFRP test ================= */
const WF_DIFF = [['60','Очень лёгкая (+60)'],['40','Лёгкая (+40)'],['20','Средняя (+20)'],['0','Непростая (+0)'],['-10','Сложная (−10)'],['-20','Трудная (−20)'],['-30','Очень трудная (−30)']];
function wfrpResult(target, roll){
  const auto = roll <= 5 ? 1 : roll >= 96 ? -1 : 0;
  let sl = Math.floor(target / 10) - Math.floor((roll === 100 ? 100 : roll) / 10);
  let ok = auto === 1 ? true : auto === -1 ? false : roll <= target;
  if (ok && sl < 0) sl = 0; if (!ok && sl > 0) sl = 0;
  const dbl = roll === 100 || (roll >= 11 && roll % 11 === 0);
  return { ok, sl, auto, dbl };
}
const slTxt = (r) => (r.ok ? '+' : '−') + Math.abs(r.sl);
function slName(r){ const a = Math.abs(r.sl); if (r.ok) return a >= 6 ? 'Поразительный успех' : a >= 4 ? 'Впечатляющий успех' : a >= 2 ? 'Успех' : 'Скромный успех'; return a >= 6 ? 'Сокрушительный провал' : a >= 4 ? 'Впечатляющий провал' : a >= 2 ? 'Провал' : 'Досадный провал'; }
function toolWfrpTest(root){
  root.innerHTML = `<div class="cols2"><div class="panel"><h3>Проверка</h3><div class="form">${fld('wt', 'Значение навыка или характеристики', inum('wt', 42, 0, 150))}${fld('wd', 'Сложность', isel('wd', WF_DIFF, '0'))}${fld('wm', 'Прочие модификаторы', inum('wm', 0, -100, 100, 10))}${fld('wr', 'Свой бросок (необязательно)', '<input id="wr" type="number" min="1" max="100" placeholder="1–100">')}</div>
