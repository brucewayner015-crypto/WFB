    <div class="panel"><h3>Встречная проверка</h3><div class="form">${fld('oa', 'Значение стороны А', inum('oa', 45, 0, 150))}${fld('ob', 'Значение стороны Б', inum('ob', 35, 0, 150))}</div>
      <div class="btns" style="margin-top:12px"><button class="btn" id="oroll">${ic('dice')} Бросить за обоих</button></div><div id="oout" style="margin-top:14px"></div></div></div>
    <div class="panel"><h3>Уровни успеха</h3><div class="tbl"><table><thead><tr><th>Уровни успеха</th><th>Результат</th></tr></thead><tbody><tr><td class="num">+6 и выше</td><td>Поразительный успех</td></tr><tr><td class="num">+4…+5</td><td>Впечатляющий успех</td></tr><tr><td class="num">+2…+3</td><td>Успех</td></tr><tr><td class="num">+0…+1</td><td>Скромный успех</td></tr><tr><td class="num">−0…−1</td><td>Досадный провал</td></tr><tr><td class="num">−2…−3</td><td>Провал</td></tr><tr><td class="num">−4…−5</td><td>Впечатляющий провал</td></tr><tr><td class="num">−6 и ниже</td><td>Сокрушительный провал</td></tr></tbody></table></div>
      <p style="margin:0;color:var(--ink-3);font-size:13.5px">Уровни успеха = десятки значения, против которого бросают, минус десятки результата броска. 01–05 — всегда успех, 96–00 — всегда провал. Дубль (11, 22… 00) в бою даёт критическое попадание при успехе и промах-неудачу при провале.</p></div>`;
  const tgt = () => Math.max(0, num(root, 'wt', 0) + (+val(root, 'wd')) + num(root, 'wm', 0));
  const show = roll => {
    const t = tgt(); const r = wfrpResult(t, roll);
    root.querySelector('#wout').innerHTML = `<div class="result"><div><div class="k">Бросок / цель</div><div class="big">${String(roll === 100 ? '00' : roll).padStart(2, '0')}<span style="font-size:22px;color:var(--ink-3)"> / ${t}</span></div></div><div><div class="k">Уровни успеха</div><div class="big" style="color:${r.ok ? 'var(--ok)' : 'var(--bad)'}">${slTxt(r)}</div></div>
      <div style="flex-basis:100%"><span class="pill ${r.ok ? 'ok' : 'bad'}">${slName(r)}</span> ${r.auto === 1 ? '<span class="pill mid">Автоуспех 01–05</span>' : ''}${r.auto === -1 ? '<span class="pill mid">Автопровал 96–00</span>' : ''}${r.dbl ? `<span class="pill mid">${r.ok ? 'Дубль: критическое попадание в бою' : 'Дубль: нелепая неудача в бою'}</span>` : ''}</div></div>`;
  };
  root.querySelector('#wroll').addEventListener('click', () => show(rand(100)));
  root.querySelector('#wcheck').addEventListener('click', () => { const v = Math.round(num(root, 'wr', 0)); if (v < 1 || v > 100){ toast('Введите бросок от 1 до 100'); return; } show(v); });
  root.querySelector('#oroll').addEventListener('click', () => {
    const a = num(root, 'oa', 0), b = num(root, 'ob', 0); const ra = rand(100), rb = rand(100); const A = wfrpResult(a, ra), B = wfrpResult(b, rb);
    const sA = (A.ok ? 1 : -1) * Math.abs(A.sl), sB = (B.ok ? 1 : -1) * Math.abs(B.sl);
    let win = sA > sB ? 'А' : sB > sA ? 'Б' : (a > b ? 'А' : b > a ? 'Б' : 'никто — перебросьте');
    root.querySelector('#oout').innerHTML = `<div class="tbl"><table><tbody><tr><td>А: ${String(ra).padStart(2, '0')} против ${a}</td><td class="num">${slTxt(A)}</td></tr><tr><td>Б: ${String(rb).padStart(2, '0')} против ${b}</td><td class="num">${slTxt(B)}</td></tr></tbody></table></div>
      <div class="result"><div><div class="k">Побеждает</div><div class="big">${win}</div></div><div><div class="k">Разница уровней успеха</div><div class="big">${Math.abs(sA - sB)}</div></div></div>
      <p style="margin:8px 0 0;color:var(--ink-3);font-size:13.5px">При равных уровнях успеха побеждает сторона с более высоким значением навыка или характеристики.</p>`;
  });
  show(rand(100));
}

    const name = pick(nm[sex] || nm.m) + ' ' + pick(nm.s);
    root.querySelector('#gout').innerHTML = `<div class="panel"><div class="result" style="margin-bottom:12px"><div><div class="k">${esc(s.n)}</div><div class="big" style="font-size:34px">${esc(name)}</div></div><div><div class="k">Карьера</div><div style="font-size:20px;font-weight:700"><a class="xref" style="color:var(--blood)" href="#${car.id}">${esc(car.m.lv[0][0])}</a></div><div style="color:var(--ink-3)">${esc(car.n)} · ${esc(CLASSES[car.m.cls])}</div></div></div>
      <div class="prof"><table><thead><tr><th>Характеристики</th>${CH_ORDER.map(c => `<th><abbr title="${CH[c][1]}">${CH[c][0]}</abbr><small>${CH[c][2]}</small></th>`).join('')}</tr></thead><tbody><tr><td>Значение</td>${ch.map(x => `<td><b>${x.v}</b></td>`).join('')}</tr><tr><td style="color:var(--ink-3)">Бросок 2d10</td>${ch.map(x => `<td style="color:var(--ink-3);font-size:13px">${x.r}</td>`).join('')}</tr></tbody></table></div>${legendOf(CH_HEADS())}
      <dl class="facts"><div><dt>Раны</dt><dd>${W}</dd></div><div><dt>Движение</dt><dd>${s.m.move}</dd></div><div><dt>Судьба / Стойкость</dt><dd>${s.m.fate} / ${s.m.res}</dd></div><div><dt>Дополнительные очки</dt><dd>${s.m.extra}</dd></div></dl>
      <div class="tbl"><table><thead><tr><th class="c">Ступень</th><th>Путь карьеры</th><th>Оригинал</th>${car.m.lv[0][2] ? '<th>Статус</th>' : ''}</tr></thead><tbody>${car.m.lv.map((l, i) => `<tr><td class="c num">${i + 1}</td><td>${esc(l[0])}</td><td style="color:var(--ink-3)">${esc(l[1] || '')}</td>${car.m.lv[0][2] ? `<td>${esc(l[2] || '—')}</td>` : ''}</tr>`).join('')}</tbody></table></div></div>`;
    last = `${name} — ${s.n}, ${car.m.lv[0][0]} (${car.n})\n` + CH_ORDER.map((c, i) => `${CH[c][1]} ${ch[i].v}`).join(', ') + `\nРаны ${W}, Движение ${s.m.move}, Судьба ${s.m.fate}, Стойкость ${s.m.res}, дополнительные очки ${s.m.extra}\nПуть: ` + car.m.lv.map(l => l[0]).join(' → ');
  };
  root.querySelector('#ggo').addEventListener('click', go);
  root.querySelector('#gcopy').addEventListener('click', () => { if (last) copyText(last); });
  go();
}

/* ================= WFRP combat tracker ================= */
const CONDS = ['Горение','Кровотечение','Ослепление','Сломлен','Глухота','Опутан','Усталость','Отравление','Сбит с ног','Ошеломление','Застигнут врасплох','Без сознания'];
function toolTracker(root){
  let T = store.get('tracker', null) || { round:1, list:[{ n:'Наёмник Курт', i:41, w:12, mw:12, adv:0, c:{} }, { n:'Зверолюд', i:33, w:14, mw:14, adv:0, c:{} }, { n:'Сестра Агнета', i:38, w:11, mw:11, adv:1, c:{ 'Кровотечение':1 } }] };
  const save = () => store.set('tracker', T);
  const draw = () => {
    root.innerHTML = `<div class="panel"><div class="result"><div><div class="k">Раунд</div><div class="big">${T.round}</div></div><div class="btns"><button class="btn" id="tnext">Следующий раунд</button><button class="btn ghost" id="tsort">Упорядочить по инициативе</button><button class="btn ghost" id="tadd">${ic('plus')} Участник</button><button class="btn ghost" id="treset">Сбросить бой</button></div></div></div>
      ${T.list.map((x, i) => `<div class="panel" data-i="${i}"><div class="form" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">
          <div class="fld" style="grid-column:span 2"><label>Имя</label><input data-k="n" value="${esc(x.n)}"></div>
          <div class="fld"><label>Инициатива</label><input data-k="i" type="number" value="${x.i}"></div>
          <div class="fld"><label>Раны (из ${x.mw})</label><input data-k="w" type="number" value="${x.w}"></div>
          <div class="fld"><label>Макс. раны</label><input data-k="mw" type="number" value="${x.mw}"></div>
          <div class="fld"><label>Преимущество</label><input data-k="adv" type="number" min="0" value="${x.adv}"></div></div>
        <div class="cond" style="margin-top:10px">${CONDS.map(c => `<button data-c="${c}" class="${x.c[c] ? 'on' : ''}" title="Щелчок — добавить, правый щелчок — убрать">${c}${x.c[c] > 1 ? ' ×' + x.c[c] : ''}</button>`).join('')}</div>
        <div class="btns" style="margin-top:10px"><button class="btn sm ghost" data-w="-1">−1 рана</button><button class="btn sm ghost" data-w="1">+1 рана</button><button class="btn sm ghost" data-a="1">+1 преимущество</button><button class="btn sm ghost" data-a="0">Обнулить преимущество</button><button class="btn sm ghost" data-del="1">Убрать</button>${x.w <= 0 ? '<span class="pill bad">Раны исчерпаны: критические ранения</span>' : ''}</div></div>`).join('')}`;
  };
  root.addEventListener('change', ev => { const t = ev.target; const p = t.closest('.panel[data-i]'); if (!p || !t.dataset.k) return; const x = T.list[+p.dataset.i]; x[t.dataset.k] = t.dataset.k === 'n' ? t.value : (+t.value || 0); save(); draw(); });
  root.addEventListener('contextmenu', ev => { const b = ev.target.closest('button[data-c]'); if (!b) return; ev.preventDefault(); const x = T.list[+b.closest('.panel[data-i]').dataset.i]; const c = b.dataset.c; if (x.c[c]){ x.c[c]--; if (!x.c[c]) delete x.c[c]; } save(); draw(); });
  root.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return; const p = b.closest('.panel[data-i]'); const x = p ? T.list[+p.dataset.i] : null;
    if (b.id === 'tnext'){ T.round++; save(); draw(); }
    else if (b.id === 'tsort'){ T.list.sort((a, c) => c.i - a.i); save(); draw(); }
    else if (b.id === 'tadd'){ T.list.push({ n:'Новый участник', i:30, w:10, mw:10, adv:0, c:{} }); save(); draw(); }
    else if (b.id === 'treset'){ if (b.dataset.armed){ T = { round:1, list:[] }; save(); draw(); } else { b.dataset.armed = '1'; b.textContent = 'Нажмите ещё раз'; } }
    else if (x && b.dataset.c){ const c = b.dataset.c; x.c[c] = (x.c[c] || 0) + 1; save(); draw(); }
    else if (x && b.dataset.w){ x.w = Math.min(x.mw, x.w + (+b.dataset.w)); save(); draw(); }
    else if (x && b.dataset.a){ x.adv = b.dataset.a === '0' ? 0 : x.adv + 1; save(); draw(); }
    else if (x && b.dataset.del){ T.list.splice(+p.dataset.i, 1); save(); draw(); }
  });
  draw();
}

  { k:'roster', t:'Ростер армии', d:'Очки, категории и проверка состава', icon:'list', render:toolRoster, lead:'Простой список армии с подсчётом очков и проверкой состава. Хранится в этом браузере.' },
  { k:'wfrp-test', t:'Проверка WFRP', d:'d100, уровни успеха, встречные проверки', icon:'d10', render:toolWfrpTest, lead:'Бросьте d100 против навыка с учётом сложности или проверьте свой бросок. Уровни успеха считаются автоматически.' },
  { k:'chargen', t:'Генератор персонажа', d:'Вид, характеристики, раны и карьера', icon:'user', render:toolChargen, lead:'Быстрый персонаж для WFRP 4: характеристики по правилам вида, раны, судьба и путь карьеры.' },
  { k:'tracker', t:'Трекер боя WFRP', d:'Инициатива, раны, преимущество, состояния', icon:'shield', render:toolTracker, lead:'Следите за очерёдностью, ранами, преимуществом и состояниями участников схватки. Данные сохраняются в браузере.' }
];
